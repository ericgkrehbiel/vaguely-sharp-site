<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Vaguely Sharp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="effects.js?v=2" defer></script>
  </head>
  <body>
    <main class="landing">
      <h1 class="wordmark">
        <img src="assets/vaguely-sharp-white.png" width="4000" height="1180" alt="Vaguely Sharp">
        <span class="signal-slice" aria-hidden="true">
          <img src="assets/vaguely-sharp-white.png" width="4000" height="1180" alt="">
        </span>
        <span class="signal-band" aria-hidden="true"></span>
      </h1>
      <div class="landing-details">
        <address class="contact">
          <p><strong>Contact:</strong><br><a href="mailto:hello@vaguelysharp.com">hello@vaguelysharp.com</a></p>
          <p>NYC</p>
        </address>
        <nav class="social-links" aria-label="Social media">
          <a href="https://www.linkedin.com/company/vaguelysharp/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://www.instagram.com/vaguelysharp/" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://www.youtube.com/@vaguelysharp" target="_blank" rel="noopener noreferrer">YouTube</a>
        </nav>
      </div>
    </main>
    <div class="crt" aria-hidden="true">
      <span class="crt__roll"></span>
    </div>
    <div class="cursor" aria-hidden="true" hidden>
      <span class="crosshair crosshair--ghost"></span>
      <span class="crosshair crosshair--tip"></span>
    </div>
  </body>
</html>
